name: 🐞 Баг (dev)
description: Внутрішній баг-репорт розробника
labels: ["source:dev"]
body:
  - type: textarea
    id: what
    attributes:
      label: Що сталося?
      placeholder: Короткий опис проблеми
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Кроки відтворення
      placeholder: |
        1. Відкрити ...
        2. Натиснути ...
        3. Побачити помилку
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Що очікувалось?
  - type: input
    id: env
    attributes:
      label: Середовище
      placeholder: local / Vercel preview / prod URL
  - type: textarea
    id: logs
    attributes:
      label: Логи або скріншоти
      render: shell
